<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veilige en integere leer- en werkomgeving</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Laadscherm en startknop voor het openen van de interactieve grafiek. -->
  <div id="start-screen" class="start-screen" role="dialog" aria-label="Startscherm">
    <div class="start-card">
      <div class="loading-orbit" aria-hidden="true">
        <span></span><span></span><span></span>
        <div class="orbit-center"></div>
      </div>
      <p class="loading-label">Grafiek laden</p>
      <div class="loading-track" aria-label="Laden"><div class="loading-progress"></div></div>
      <button id="start-button" class="start-button" type="button" disabled>
        <span>Start interactieve grafiek</span>
      </button>
    </div>
  </div>

  <main class="shell">
    <!-- Drie rolkaarten met een eigen rood, oranje of groen gekleurde indicator. -->
    <div class="roles" aria-label="Rolkeuze">
      <button class="role-card active" data-role="belangrijk">
        <span class="board"><span class="color-stack"><i class="dot red"></i><i class="dot orange"></i><i class="dot green"></i></span></span>
        <span class="role-text">Speelt belangrijke rol</span>
      </button>
      <button class="role-card" data-role="beperkt">
        <span class="board"><span class="color-stack"><i class="dot red"></i><i class="dot orange"></i><i class="dot green"></i></span></span>
        <span class="role-text">Speelt beperkte rol</span>
      </button>
      <button class="role-card" data-role="geen">
        <span class="board"><span class="color-stack"><i class="dot red"></i><i class="dot orange"></i><i class="dot green"></i></span></span>
        <span class="role-text">Speelt geen rol</span>
      </button>
    </div>

    <!-- Interactieve grafiek in de vorm van een cirkel met verschillende thema's. -->
    <div class="wheel-area">
      <svg id="graph" viewBox="0 0 820 820" role="img" aria-label="Interactieve cirkel met elf thema's">
        <g id="wheel">
          <circle cx="410" cy="410" r="370" class="ring"/>
          <circle cx="410" cy="410" r="322" fill="#fffdf7" stroke="#06364a" stroke-width="1.2"/>

          <g id="sectors"></g>

          <text x="410" y="38" class="number ring-title" text-anchor="middle">Sociaal &amp; Gedrag</text>
          <text x="70" y="420" class="number ring-title vertical-left" transform="rotate(-86 70 420)" text-anchor="middle">Naleving &amp; Integriteit</text>
          <text x="113" y="665" class="number ring-title" transform="rotate(-51 113 665)" text-anchor="middle">Onderzoek &amp; Kennis</text>
          <text x="410" y="806" class="number ring-title" text-anchor="middle">Digitaal &amp; Informatie</text>
          <text x="690" y="665" class="number ring-title" transform="rotate(51 690 665)" text-anchor="middle">Fysiek &amp; Omgeving</text>

          <circle cx="410" cy="410" r="112" class="center-ring"/>
          <circle cx="410" cy="410" r="96" class="center-ring-inner"/>
          <text x="410" y="393" class="label" text-anchor="middle">Veilige en integere</text>
          <text x="410" y="415" class="label" text-anchor="middle">leer- en</text>
          <text x="410" y="437" class="label" text-anchor="middle">werkomgeving</text>

          <g id="markers"></g>
        </g>
      </svg>
      <button id="reset-markers" class="reset-button" type="button">Posities resetten</button>
    </div>

    <!-- Legenda met één gekleurde dot naast elk gevolg. -->
    <aside class="legend" aria-label="Legenda">
      <div class="legend-item">
        <i class="dot red legend-source" data-color="red" tabindex="0" aria-label="Sleep een rode bal naar een veld"></i>
        <span class="legend-text">Groot gevolg</span>
      </div>
      <div class="legend-item">
        <i class="dot orange legend-source" data-color="orange" tabindex="0" aria-label="Sleep een oranje bal naar een veld"></i>
        <span class="legend-text">Gemiddeld gevolg</span>
      </div>
      <div class="legend-item">
        <i class="dot green legend-source" data-color="green" tabindex="0" aria-label="Sleep een groene bal naar een veld"></i>
        <span class="legend-text">Nauwelijks of geen gevolg</span>
      </div>
    </aside>

    <!-- Cinematisch informatiepaneel dat verschijnt na het kiezen van een onderwerp. -->
    <section id="topic-focus" class="topic-focus" aria-live="polite" aria-hidden="true">
      <button id="close-topic" class="topic-close" type="button" aria-label="Onderwerp sluiten">×</button>
      <span id="topic-number" class="topic-number">01</span>
      <h2 id="topic-title">Onderwerp</h2>
      <p id="topic-description">Selecteer een thema om meer informatie te bekijken.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
